[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodyspecy"
version = "0.1.0"
description = "Local-first BodySpec DEXA data import and MCP server for LLM analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.10.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=0.4.0",
]
all = [
    "pdfplumber>=0.10.0",
    "sqlalchemy>=2.0.0",
    "fastmcp>=0.4.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
bodyspecy-import = "bodyspecy.localdb.cli:main"
bodyspecy-mcp = "bodyspecy.mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 88
